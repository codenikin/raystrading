services:
  payload:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rays
    volumes:
      - ./public/media:/app/public/media
    ports:
      - "3333:3000"
    depends_on:
      - db
    restart: unless-stopped
    environment:
      - PAYLOAD_SECRET=secret
      - DATABASE_URL=postgresql://rays:secret@db/raysdb
      - NEXT_PUBLIC_SERVER_URL https://raystrading.com
      - NEXT_PUBLIC_ORG_NAME Raystrading
    networks:
      - default-net

  db:
    image: docker.io/library/postgres:latest
    environment:
      - POSTGRES_USER=rays
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=raysdb
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - default-net
volumes:
  postgres-data:


networks:
  default-net:
    driver: bridge
